<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Course Generator | SkillRoute AI</title>
    <link rel="stylesheet" href="/styles/global.css">
    <link rel="stylesheet" href="/styles/modules.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <header class="navbar">
        <div class="container nav-inner">
            <a href="/" class="brand">
                <i class="fas fa-route"></i>
                SkillRoute AI
            </a>
            <nav class="nav-links">
                <a href="/">Home</a>
                <a href="/course" class="active">Course Generator</a>
                <a href="/roadmap">Roadmap</a>
                <a href="/skill-eval">Evaluator</a>
            </nav>
            <div id="nav-auth" class="nav-auth">
                <button class="btn btn-secondary" onclick="logout()">Sign Out</button>
            </div>
        </div>
    </header>

    <main>
        <section class="module-container">
            <div class="container">
                <h1>AI Course Generator</h1>
                <p class="subtitle">Generate personalized learning curricula instantly</p>

                <div class="generator-form">
                    <div class="form-group">
                        <label for="course-name">Course Name</label>
                        <input type="text" id="course-name" placeholder="e.g., Advanced React, Python Basics" required>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="course-duration">Duration</label>
                            <select id="course-duration">
                                <option value="2">2 weeks</option>
                                <option value="4" selected>4 weeks</option>
                                <option value="8">8 weeks</option>
                                <option value="12">12 weeks</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="course-level">Level</label>
                            <select id="course-level">
                                <option value="Beginner">Beginner</option>
                                <option value="Intermediate" selected>Intermediate</option>
                                <option value="Advanced">Advanced</option>
                            </select>
                        </div>
                    </div>

                    <button class="btn btn-primary btn-lg" onclick="handleGenerateCourse()">Generate Curriculum</button>
                </div>

                <div id="course-result" class="result-container hidden">
                    <h2>Your Course Curriculum</h2>
                    <div id="curriculum-output" class="curriculum-output"></div>
                    <button class="btn btn-secondary" onclick="resetCourseForm()">Generate Another</button>
                </div>

                <div id="loading" class="loading hidden">
                    <div class="spinner"></div>
                    <p>Generating your course curriculum...</p>
                </div>
            </div>
        </section>
    </main>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2024 SkillRoute AI. All rights reserved.</p>
        </div>
    </footer>

    <script type="module" src="/js/course.js"></script>
</body>
</html>
