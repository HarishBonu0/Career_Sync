<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roadmap Generator | SkillRoute AI</title>
    <link rel="stylesheet" href="/styles/global.css">
    <link rel="stylesheet" href="/styles/modules.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <header class="navbar">
        <div class="container nav-inner">
            <a href="/" class="brand">
                <i class="fas fa-route"></i>
                SkillRoute AI
            </a>
            <nav class="nav-links">
                <a href="/">Home</a>
                <a href="/course">Course Generator</a>
                <a href="/roadmap" class="active">Roadmap</a>
                <a href="/skill-eval">Evaluator</a>
            </nav>
            <div id="nav-auth" class="nav-auth">
                <button class="btn btn-secondary" onclick="logout()">Sign Out</button>
            </div>
        </div>
    </header>

    <main>
        <section class="module-container">
            <div class="container">
                <h1>Career Roadmap Engine</h1>
                <p class="subtitle">Create your personalized path to career advancement</p>

                <div class="generator-form">
                    <div class="form-group">
                        <label for="current-role">Current Role</label>
                        <input type="text" id="current-role" placeholder="e.g., Junior Developer, Data Analyst" required>
                    </div>

                    <div class="form-group">
                        <label for="target-role">Target Role</label>
                        <input type="text" id="target-role" placeholder="e.g., Senior Developer, ML Engineer" required>
                    </div>

                    <div class="form-group">
                        <label for="roadmap-timeline">Timeline</label>
                        <select id="roadmap-timeline">
                            <option value="6">6 months</option>
                            <option value="12" selected>12 months</option>
                            <option value="18">18 months</option>
                            <option value="24">24 months</option>
                        </select>
                    </div>

                    <button class="btn btn-primary btn-lg" onclick="handleGenerateRoadmap()">Generate Roadmap</button>
                </div>

                <div id="roadmap-result" class="result-container hidden">
                    <h2>Your Career Roadmap</h2>
                    <div id="roadmap-output" class="roadmap-output"></div>
                    <button class="btn btn-secondary" onclick="resetRoadmapForm()">Generate Another</button>
                </div>

                <div id="loading" class="loading hidden">
                    <div class="spinner"></div>
                    <p>Creating your career roadmap...</p>
                </div>
            </div>
        </section>
    </main>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2024 SkillRoute AI. All rights reserved.</p>
        </div>
    </footer>

    <script type="module" src="/js/roadmap.js"></script>
</body>
</html>
