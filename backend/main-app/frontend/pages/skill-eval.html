<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skill Evaluator | SkillRoute AI</title>
    <link rel="stylesheet" href="/styles/global.css">
    <link rel="stylesheet" href="/styles/modules.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <header class="navbar">
        <div class="container nav-inner">
            <a href="/" class="brand">
                <i class="fas fa-route"></i>
                SkillRoute AI
            </a>
            <nav class="nav-links">
                <a href="/">Home</a>
                <a href="/course">Course Generator</a>
                <a href="/roadmap">Roadmap</a>
                <a href="/skill-eval" class="active">Evaluator</a>
            </nav>
            <div id="nav-auth" class="nav-auth">
                <button class="btn btn-secondary" onclick="logout()">Sign Out</button>
            </div>
        </div>
    </header>

    <main>
        <section class="module-container">
            <div class="container">
                <h1>AI Skill Evaluator</h1>
                <p class="subtitle">Test and validate your expertise with AI-powered assessment</p>

                <!-- Setup Section -->
                <div id="setup-section" class="generator-form">
                    <div class="form-group">
                        <label for="skill-name">Skill to Evaluate</label>
                        <input type="text" id="skill-name" placeholder="e.g., JavaScript, Python, React" required>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="eval-difficulty">Difficulty Level</label>
                            <select id="eval-difficulty">
                                <option value="Beginner">Beginner</option>
                                <option value="Intermediate" selected>Intermediate</option>
                                <option value="Advanced">Advanced</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="eval-count">Number of Questions</label>
                            <select id="eval-count">
                                <option value="10">10 Questions</option>
                                <option value="20" selected>20 Questions</option>
                                <option value="30">30 Questions</option>
                            </select>
                        </div>
                    </div>

                    <button class="btn btn-primary btn-lg" onclick="startEvaluation()">Start Evaluation</button>
                </div>

                <!-- Test Section -->
                <div id="test-section" class="test-container hidden">
                    <div class="progress-bar">
                        <div id="progress-fill" class="progress-fill"></div>
                    </div>
                    <p id="question-counter" class="question-counter"></p>

                    <div id="questions-container" class="questions-container"></div>

                    <button class="btn btn-primary btn-lg" onclick="handleSubmitEvaluation()">Submit Evaluation</button>
                </div>

                <!-- Results Section -->
                <div id="result-section" class="result-container hidden">
                    <h2>Evaluation Results</h2>
                    <div id="results-output" class="results-output"></div>
                    <button class="btn btn-secondary" onclick="resetEvaluation()">Take Another Test</button>
                </div>

                <div id="loading" class="loading hidden">
                    <div class="spinner"></div>
                    <p>Generating evaluation questions...</p>
                </div>
            </div>
        </section>
    </main>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2024 SkillRoute AI. All rights reserved.</p>
        </div>
    </footer>

    <script type="module" src="/js/skill-eval.js"></script>
</body>
</html>
