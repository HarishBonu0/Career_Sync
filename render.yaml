services:
  # Backend API Service
  - type: web
    name: careersync-backend
    runtime: node
    region: oregon
    plan: free
    buildCommand: cd backend/main-app/backend && npm install
    startCommand: cd backend/main-app/backend && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: EMAILJS_SERVICE_ID
        sync: false
      - key: EMAILJS_TEMPLATE_ID
        sync: false
      - key: EMAILJS_PUBLIC_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: EMAILJS_PRIVATE_KEY
        sync: false
      - key: YOUTUBE_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false

  # Course Generation Frontend
  - type: web
    name: careersync-course-gen
    runtime: node
    region: oregon
    plan: free
    buildCommand: cd frontend/course-generation && npm install && npm run build
    startCommand: cd frontend/course-generation && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        value: https://careersync-backend.onrender.com
      - key: OPENROUTER_API_KEY
        sync: false
      - key: YOUTUBE_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false

  # Landing Page
  - type: web
    name: careersync-landing
    runtime: node
    region: oregon
    plan: free
    buildCommand: cd frontend/landing-page && npm install && npm run build
    startCommand: cd frontend/landing-page && npx vite preview --host 0.0.0.0 --port $PORT
    envVars:
      - key: NODE_ENV
        value: production

  # Roadmap Frontend
  - type: web
    name: careersync-roadmap
    runtime: node
    region: oregon
    plan: free
    buildCommand: cd frontend/roadmap && npm install && npm run build
    startCommand: cd frontend/roadmap && npm run preview
    envVars:
      - key: VITE_API_URL
        value: https://careersync-backend.onrender.com
      - key: VITE_GEMINI_API_KEY
        sync: false
