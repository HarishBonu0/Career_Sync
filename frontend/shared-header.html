<!-- Shared CareerOS Header Component -->
<!-- This file contains the unified header HTML and styles used across all modules -->

<style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    
    :root {
        --brand-primary: #4F46E5;
        --brand-secondary: #7C3AED;
        --text-primary: #0F172A;
        --text-secondary: #475569;
        --text-tertiary: #94A3B8;
        --bg-light: #FFFFFF;
        --border-light: #E2E8F0;
        --header-height: 72px;
        --container-max: 1200px;
    }
    
    .careeros-header {
        position: sticky;
        top: 0;
        z-index: 100;
        height: var(--header-height);
        background: rgba(255, 255, 255, 0.98);
        backdrop-filter: blur(20px);
        border-bottom: 1px solid rgba(226, 232, 240, 0.8);
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08), 0 1px 3px rgba(0, 0, 0, 0.04);
    }

    .careeros-header-container {
        display: flex;
        align-items: center;
        justify-content: space-between;
        max-width: var(--container-max);
        margin: 0 auto;
        padding: 0 24px;
        height: 100%;
    }

    .careeros-brand {
        display: flex;
        align-items: center;
        gap: 12px;
        text-decoration: none;
        color: var(--text-primary);
        font-size: 1.125rem;
        font-weight: 700;
        cursor: pointer;
    }

    .careeros-brand-icon {
        width: 28px;
        height: 28px;
        border-radius: 6px;
        background: linear-gradient(135deg, var(--brand-primary) 0%, var(--brand-secondary) 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-weight: 700;
        font-size: 0.75rem;
        box-shadow: 0 2px 4px rgba(79, 70, 229, 0.25);
    }

    .careeros-nav-links {
        display: flex;
        align-items: center;
        gap: 32px;
        flex: 1;
        justify-content: center;
    }

    .careeros-nav-link {
        color: var(--text-secondary);
        font-weight: 500;
        font-size: 0.9rem;
        text-decoration: none;
        cursor: pointer;
        padding: 8px 0;
        transition: color 0.2s;
    }

    .careeros-nav-link:hover {
        color: var(--brand-primary);
    }

    .careeros-nav-auth {
        display: flex;
        align-items: center;
        gap: 16px;
    }

    .careeros-btn {
        padding: 10px 20px;
        border: none;
        border-radius: 6px;
        font-weight: 600;
        font-size: 0.875rem;
        cursor: pointer;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        transition: all 0.2s;
    }

    .careeros-btn-primary {
        background: var(--brand-primary);
        color: white;
    }

    .careeros-btn-primary:hover {
        background: var(--brand-secondary);
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.07);
    }

    .careeros-btn-danger {
        background: #EF4444;
        color: white;
    }

    .careeros-btn-danger:hover {
        background: #DC2626;
    }

    .careeros-user-info {
        color: var(--text-secondary);
        font-size: 0.875rem;
        font-weight: 500;
    }
</style>

<!-- Shared Header HTML -->
<header class="careeros-header">
    <div class="careeros-header-container">
        <a href="http://localhost:4173" class="careeros-brand">
            <div class="careeros-brand-icon">C</div>
            <span>CareerOS</span>
        </a>

        <nav class="careeros-nav-links">
            <a href="http://localhost:3002" class="careeros-nav-link">📚 Course Gen</a>
            <a href="http://localhost:5173" class="careeros-nav-link">🗺️ Roadmaps</a>
            <a href="http://localhost:3001" class="careeros-nav-link">✅ Evaluator</a>
        </nav>

        <div id="careeros-nav-auth" class="careeros-nav-auth">
            <a href="http://localhost:4173/auth.html" class="careeros-btn careeros-btn-primary">
                Sign In
            </a>
        </div>
    </div>
</header>

<script>
    // Update auth UI across all pages
    function updateAuthUI() {
        const authContainer = document.getElementById('careeros-nav-auth');
        if (!authContainer) return;

        const user = localStorage.getItem('careeros_user');
        const token = localStorage.getItem('careeros_token');

        if (user && token) {
            try {
                const userData = JSON.parse(user);
                authContainer.innerHTML = `
                    <div style="display: flex; align-items: center; gap: 12px;">
                        <span class="careeros-user-info">
                            👤 ${userData.full_name || userData.email || 'User'}
                        </span>
                        <button id="careeros-logout-btn" class="careeros-btn careeros-btn-danger">
                            Sign Out
                        </button>
                    </div>
                `;

                const logoutBtn = document.getElementById('careeros-logout-btn');
                if (logoutBtn) {
                    logoutBtn.addEventListener('click', (e) => {
                        e.preventDefault();
                        localStorage.removeItem('careeros_user');
                        localStorage.removeItem('careeros_token');
                        localStorage.removeItem('careeros_auth');
                        window.location.href = 'http://localhost:4173/auth.html';
                    });
                }
            } catch (e) {
                console.error('Invalid user data:', e);
                localStorage.removeItem('careeros_user');
                localStorage.removeItem('careeros_token');
                localStorage.removeItem('careeros_auth');
            }
        } else {
            authContainer.innerHTML = `
                <a href="http://localhost:4173/auth.html" class="careeros-btn careeros-btn-primary">
                    Sign In
                </a>
            `;
        }
    }

    // Check auth on load and every 2 seconds
    document.addEventListener('DOMContentLoaded', updateAuthUI);
    setInterval(updateAuthUI, 2000);

    // Also update auth UI when storage changes from other tabs
    window.addEventListener('storage', (e) => {
        if (e.key === 'careeros_user' || e.key === 'careeros_token') {
            updateAuthUI();
        }
    });
</script>
