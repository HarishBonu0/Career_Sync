        window.getModuleUrls = function() {
            const isProduction = window.location.hostname.includes('onrender.com');
            if (isProduction) {
                const baseUrl = window.location.hostname.replace(/^[^.]+\./, '');
                return {
                    course: `https://careersync-course-gen.${baseUrl}`,
                    roadmap: `https://careersync-roadmap.${baseUrl}`,
                    skillEval: `https://careersync-evaluator.${baseUrl}`,
                    backend: `https://careersync-backend.${baseUrl}`,
                    landing: `https://careersync-landing.${baseUrl}`
                };
            }
            return {
                course: 'http://localhost:3002',
                roadmap: 'http://localhost:5173',

    <script>
        // Initialize global course data storage at the very beginning
        if (!window.courseData) {
            window.courseData = {};
            console.log('✅ Initialized window.courseData');
        }
        
        // Debug logging
        console.log('Profile page loaded');
        console.log('LocalStorage keys:', Object.keys(localStorage));
        console.log('careersync_user:', localStorage.getItem('careersync_user'));
        console.log('careersync_token:', localStorage.getItem('careersync_token'));
        console.log('Cookies:', document.cookie);

        // Helper function to get cookie value
        function getCookie(name) {
            const value = `; ${document.cookie}`;
            const parts = value.split(`; ${name}=`);
            if (parts.length === 2) return parts.pop().split(';').shift();
            return null;
        }

        // ==================== MODULE COMPLETION TRACKING ====================
        
        /**
         * Get the storage key for a course's completed modules
         */
        function getCompletedModulesKey(courseId) {
            return `careersync_course_${courseId}_completed_modules`;
        }

        /**
         * Get list of completed module IDs for a course
         */
        function getCompletedModules(courseId) {
            const key = getCompletedModulesKey(courseId);
            const data = localStorage.getItem(key);
            return data ? JSON.parse(data) : [];
        }

        /**
         * Get count of completed modules
         */
        function getCompletedModulesCount(courseId) {
            return getCompletedModules(courseId).length;
        }

        /**
         * Mark a module as completed
         */
        function markModuleCompleted(courseId, moduleId) {
            const completed = getCompletedModules(courseId);
            if (!completed.includes(moduleId)) {
                completed.push(moduleId);
                const key = getCompletedModulesKey(courseId);
                localStorage.setItem(key, JSON.stringify(completed));
                console.log(`✅ Module marked completed: ${moduleId}`);
                // Refresh profile to update percentages
                location.reload();
            }
        }

        /**
         * Unmark a module as completed
         */
        function unmarkModuleCompleted(courseId, moduleId) {
            const completed = getCompletedModules(courseId);
            const index = completed.indexOf(moduleId);
            if (index > -1) {
                completed.splice(index, 1);
                const key = getCompletedModulesKey(courseId);
                localStorage.setItem(key, JSON.stringify(completed));
                console.log(`❌ Module unmarked: ${moduleId}`);
                // Refresh profile to update percentages
                location.reload();
            }
        }

        /**
         * Check if a module is completed
         */
        function isModuleCompleted(courseId, moduleId) {
            return getCompletedModules(courseId).includes(moduleId);
        }

        /**
         * Navigate to course viewer and pass full course data
         */
        function navigateToCourseViewer(courseId) {
            console.log('🚀 Navigating to course viewer for:', courseId);
            
            if (window.courseData && window.courseData[courseId]) {
                const courseInfo = window.courseData[courseId];

        async function loadProfile() {
            try {
                // Check multiple auth storage methods
                let user = localStorage.getItem('careersync_user');
                let token = localStorage.getItem('careersync_token');
                
                // Also check cookies (backend sets cookies)
                const cookieToken = getCookie('careersync_token');
                
                console.log('Initial auth check - user:', !!user, 'token:', !!token, 'cookieToken:', !!cookieToken);
                
                // Fallback to other possible storage keys
                if (!user) {
                    user = localStorage.getItem('user');
                    console.log('Fallback user check:', !!user);
                }
                if (!token) {
                    token = localStorage.getItem('token') || localStorage.getItem('careersync_auth') || cookieToken;
                    console.log('Fallback token check:', !!token);
                }

                // If we have cookie token but no user, fetch user from backend
                if (!user && cookieToken) {
                    console.log('Found cookie token, fetching user from backend...');
                    try {
                        const response = await fetch('http://localhost:5000/api/auth/me', {
                            credentials: 'include', // Important: include cookies in request
                            headers: {
                                'Content-Type': 'application/json'
                            }
                        });
                        
                        if (response.ok) {
                            const data = await response.json();
                            console.log('Fetched user from backend:', data);
                            if (data.user || data.data) {
                                user = JSON.stringify(data.user || data.data);
                                localStorage.setItem('careersync_user', user);
                                token = cookieToken;
                                console.log('User data stored in localStorage');
                            }
                        } else {
                            console.log('Backend response not OK:', response.status);
                        }
                    } catch (err) {
                        console.log('Could not fetch user from backend:', err);
                    }
                }

                // Check if we have valid auth data
                if (!user && !token && !cookieToken) {
                    console.log('No authentication found, showing login message');
                    document.getElementById('loading').innerHTML = `
                        <div style="padding: 40px; text-align: center;">
                            <h2 style="color: var(--brand-primary); margin-bottom: 16px;">Please Login</h2>
                            <p style="margin-bottom: 24px; color: var(--text-secondary);">
                                You need to be logged in to view your profile.
                            </p>
                            <a href="' + getModuleUrls().landing + '/auth.html" 
                               style="display: inline-block; padding: 12px 24px; background: var(--brand-primary); 
                                      color: white; text-decoration: none; border-radius: 8px; font-weight: 600;">
                                Go to Login
                            </a>
                        </div>
                    `;
                    return;
                }

                console.log('Auth found, proceeding to load profile');

                // If we have token but no user, try to fetch user from backend
                if (token && !user) {
                    try {
                        const response = await fetch('http://localhost:5000/api/auth/me', {
                            credentials: 'include',
                            headers: {
                                'Authorization': `Bearer ${token}`,
                                'Content-Type': 'application/json'
                            }
                        });
                        
                        if (response.ok) {
                            const data = await response.json();
                            console.log('Additional backend fetch:', data);
                            if (data.user || data.data) {
                                user = JSON.stringify(data.user || data.data);
                                localStorage.setItem('careersync_user', user);
                            }
                            console.log('Fetched user from backend');
                        }
                    } catch (err) {
                        console.log('Could not fetch user from backend:', err);
                    }
                }

                // Parse user data
                let userData;
                try {
                    userData = typeof user === 'string' ? JSON.parse(user) : user;
                    console.log('Parsed user data:', userData);
                } catch (e) {
                    console.error('Error parsing user data:', e);
                    // Create minimal user data from email if available
                    userData = { 
                        email: 'user@example.com',
                        name: 'User'
                    };
                }

                const userId = userData.id || userData._id || userData.user_id;
                console.log('User ID:', userId);

                // Always display the cached profile immediately
                displayCachedProfile(userData);

                // Increment visit count
                let visitCount = parseInt(localStorage.getItem('careersync_profile_visits') || '0');
                visitCount++;
                localStorage.setItem('careersync_profile_visits', visitCount.toString());
                console.log('Profile visit count:', visitCount);

                // Then try to fetch additional data from backend if available
                if (userId) {
                    try {
                        const response = await fetch(`http://localhost:5000/api/profile/${userId}`, {
                            credentials: 'include',
                            headers: {
                                'Authorization': `Bearer ${token}`,
                                'Content-Type': 'application/json'
                            }
                        });

                        if (response.ok) {
                            const data = await response.json();
                            console.log('Backend profile data:', data);
                            if (data.success && data.profile) {
                                // Update with backend data if available
                                displayProfile(data.profile);
                                fetchSupplementalProfileData(userId, userData.email || data.profile.email, token);
                            }
                        } else {
                            console.log('Backend response not OK:', response.status);
                        }
                    } catch (backendError) {
                        console.log('Backend profile not available, using localStorage data:', backendError);
                    }
                } else {
                    console.log('No userId available for backend fetch');
                }
            } catch (error) {
                console.error('Error loading profile:', error);
                document.getElementById('loading').innerHTML = `
                    <div style="padding: 40px; text-align: center;">
                        <h2 style="color: #EF4444; margin-bottom: 16px;">Error Loading Profile</h2>
                        <p style="margin-bottom: 24px; color: var(--text-secondary);">
                            ${error.message}
                        </p>
                        <a href="http://localhost:4173/auth.html" 
                           style="display: inline-block; padding: 12px 24px; background: var(--brand-primary); 
                                  color: white; text-decoration: none; border-radius: 8px; font-weight: 600;">
                            Go to Login
                        </a>
                    </div>
                `;
            }
        }

        function displayProfile(profileData) {

                console.log('✅ Courses saved to localStorage');

            document.getElementById('stat-evaluations').textContent = evaluations.length;

            // Display Courses

                    let totalTopics = course.totalTopics || 0;

                        totalTopics = course.modules.reduce((sum, module) => {
                            return sum + ((module.topics && module.topics.length) || 0);

                    }
                    
                    // Use saved progress from course-viewer, fallback to module-based calculation
                    const progressPercentage = course.progress !== undefined ? course.progress : Math.round((getCompletedModulesCount(courseId) / totalModules) * 100);
                    
                    // Store course data globally for modal access
                    window.courseData[courseId] = {
                        courseId: courseId,
                        id: courseId,
                        _id: courseId,
                        title: course.title,
                        duration: course.duration,
                        level: course.level,
                        modules: course.modules || []
                    };
                    
                    console.log(`✅ Stored course: ${courseId}`);
                    console.log(`   Modules: ${course.modules ? course.modules.length : 0}`);

                        </div>

                                <p class="item-title">${roadmap.title || 'Roadmap'}</p>

                                    <span class="meta-tag">🎯 ${roadmap.targetRole || 'Career Path'}</span>
                                    <span class="meta-tag">📍 ${(roadmap.stages && roadmap.stages.length) || roadmap.stages || 5} stages</span>
                                    <span class="meta-tag">⏱️ ${roadmap.duration || roadmap.timeline || '6 months'}</span>
                                </div>
                            </div>
                            ${(roadmap.progress || 0) >= 100 ? '<span class="item-badge">Completed</span>' : ''}
                        </div>
                        <div class="progress-container">
                            <div class="progress-header">
                                <span class="progress-label">${Math.floor(((roadmap.progress || 0) / 100) * ((roadmap.stages && roadmap.stages.length) || roadmap.stages || 5))} of ${(roadmap.stages && roadmap.stages.length) || roadmap.stages || 5} completed</span>
                                <span class="progress-percent">${roadmap.progress || 0}%</span>
                            </div>
                            <div class="progress-bar">
                                <div class="progress-fill" style="width: ${roadmap.progress || 0}%"></div>
                            </div>
                        </div>
                        <div class="item-actions">
                            <a href="http://localhost:5173" class="btn-continue">${(roadmap.progress || 0) > 0 ? '▶️ Continue' : '🚀 Start'}</a>

                        </div>

            } else {
                roadmapContainer.innerHTML = '<div class="empty-state"><div class="empty-icon">🗺️</div><div class="empty-text">No roadmaps yet</div><a href="' + getModuleUrls().roadmap + '" class="action-btn primary">Create Roadmap</a></div>';
            }
        }

        function renderEvaluations(evaluations) {
            const evalContainer = document.getElementById('evaluations-container');
            if (evaluations && evaluations.length > 0) {
                evalContainer.innerHTML = evaluations.map(evaluation => {
                    const score = evaluation.score || evaluation.percentage || 0;
                    const passed = score >= 80;
                    return `
                        <div class="item-card">
                            <div class="item-header">
                                <div>
                                    <p class="item-title">${evaluation.title || evaluation.skillName || evaluation.topic || 'Evaluation'}</p>
                                    <div class="item-meta">
                                        <span class="meta-tag">📝 ${evaluation.totalQuestions || 10} questions</span>
                                        <span class="meta-tag">✅ ${evaluation.correctAnswers || 0} correct</span>
                                        <span class="meta-tag">🕐 ${evaluation.completedAt ? new Date(evaluation.completedAt).toLocaleDateString() : 'Recent'}</span>
                                    </div>
                                </div>
                                <span class="item-badge" style="background: ${passed ? '#10B981' : '#EF4444'}">${passed ? 'Passed' : 'Retake'}</span>
                            </div>
                            <div class="progress-container">
                                <div class="progress-header">
                                    <span class="progress-label">Score</span>
                                    <span class="progress-percent">${score}%</span>
                                </div>
                                <div class="progress-bar">
                                    <div class="progress-fill" style="width: ${score}%; background: ${passed ? 'linear-gradient(90deg, #10B981, #059669)' : 'linear-gradient(90deg, #EF4444, #DC2626)'}"></div>
                                </div>
                            </div>
                            <div class="item-actions">
                                <a href="http://localhost:3001" class="btn-continue">${passed ? '✅ View' : '🔄 Retake'}</a>
                                <a href="http://localhost:3001" class="btn-view">New Test</a>
                            </div>
                        </div>
                    `;
                }).join('');
            } else {
                evalContainer.innerHTML = '<div class="empty-state"><div class="empty-icon">✅</div><div class="empty-text">No evaluations yet</div><a href="' + getModuleUrls().skillEval + '" class="action-btn primary">Take Test</a></div>';
            }
        }

        async function fetchSupplementalProfileData(userId, email, token) {
            try {
                const headers = { 'Content-Type': 'application/json' };
                if (token) headers.Authorization = `Bearer ${token}`;

                const query = userId ? `userId=${encodeURIComponent(userId)}` : `userEmail=${encodeURIComponent(email)}`;

                const [roadmapResp, evalResp] = await Promise.all([
                    fetch(`http://localhost:5000/api/roadmaps?${query}`, { credentials: 'include', headers }),
                    fetch(`http://localhost:5000/api/skillEval?${query}`, { credentials: 'include', headers })
                ]);

                if (roadmapResp.ok) {
                    const roadmapData = await roadmapResp.json();
                    const roadmaps = roadmapData.roadmaps || roadmapData.data || [];
                    if (roadmaps.length > 0) {
                        localStorage.setItem('careersync_saved_roadmaps', JSON.stringify(roadmaps));
                        renderRoadmaps(roadmaps);
                    }
                }

                if (evalResp.ok) {
                    const evalData = await evalResp.json();
                    const evaluations = evalData.evaluations || evalData.data || [];
                    if (evaluations.length > 0) {
                        localStorage.setItem('careersync_evaluations', JSON.stringify(evaluations));
                        renderEvaluations(evaluations);
                    }
                }
            } catch (error) {
                console.log('Supplemental profile fetch failed:', error);
            }
        }

        // Refresh profile when page becomes visible (returns from course-viewer)
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') {
                console.log('📱 Page returned to focus, refreshing profile...');
                refreshProfileData();
            }
        });

        // Also refresh when navigating back to the page
        window.addEventListener('pageshow', (event) => {
            // Fires when navigating back via browser back button
            if (event.persisted) {
                console.log('📱 Page loaded from cache, refreshing profile...');
                refreshProfileData();
            }
        });

        // Refresh when window gains focus
        window.addEventListener('focus', () => {
            console.log('📱 Window focused, refreshing profile...');
            refreshProfileData();
        });

        function refreshProfileData() {
            const userData = JSON.parse(localStorage.getItem('careersync_user') || '{}');
            const token = localStorage.getItem('careersync_token');
            
            if (userData && userData.id) {
                // Reload courses from localStorage (which may have been updated by course-viewer)
                const courses = JSON.parse(localStorage.getItem('careersync_enrolled_courses') || '[]');
                const roadmaps = JSON.parse(localStorage.getItem('careersync_saved_roadmaps') || '[]');
                const evaluations = JSON.parse(localStorage.getItem('careersync_evaluations') || '[]');
                
                console.log('🔄 Refreshing with courses:', courses.map(c => ({
                    title: c.title,
                    progress: c.progress,
                    completedTopics: c.completedTopics,
                    totalTopics: c.totalTopics
                })));
                
                displayProfile({
                    courses: courses,
                    roadmaps: roadmaps,
                    evaluations: evaluations
                });
            }
        }

                    localStorage.removeItem('careersync_auth');

            }
        });
