    <script>
        // Initialize global course data storage at the very beginning
        if (!window.courseData) {
            window.courseData = {};
            console.log('✅ Initialized window.courseData');
        }
        
        // Debug logging
        console.log('Profile page loaded');
        console.log('LocalStorage keys:', Object.keys(localStorage));
        console.log('careersync_user:', localStorage.getItem('careersync_user'));
        console.log('careersync_token:', localStorage.getItem('careersync_token'));
        console.log('Cookies:', document.cookie);

        // Helper function to get cookie value
        function getCookie(name) {
            const value = `; ${document.cookie}`;
            const parts = value.split(`; ${name}=`);
            if (parts.length === 2) return parts.pop().split(';').shift();
            return null;
        }

        // ==================== MODULE COMPLETION TRACKING ====================
        
        /**
         * Get the storage key for a course's completed modules
         */
        function getCompletedModulesKey(courseId) {
            return `careersync_course_${courseId}_completed_modules`;
        }

        /**
         * Get list of completed module IDs for a course
         */
        function getCompletedModules(courseId) {
            const key = getCompletedModulesKey(courseId);
            const data = localStorage.getItem(key);
            return data ? JSON.parse(data) : [];
        }

        /**
         * Get count of completed modules
         */
        function getCompletedModulesCount(courseId) {
            return getCompletedModules(courseId).length;
        }

        /**
         * Mark a module as completed
         */
        function markModuleCompleted(courseId, moduleId) {
            const completed = getCompletedModules(courseId);
            if (!completed.includes(moduleId)) {
                completed.push(moduleId);
                const key = getCompletedModulesKey(courseId);
                localStorage.setItem(key, JSON.stringify(completed));
                console.log(`✅ Module marked completed: ${moduleId}`);
                // Refresh profile to update percentages
                location.reload();
            }
        }

        /**
         * Unmark a module as completed
         */
        function unmarkModuleCompleted(courseId, moduleId) {
            const completed = getCompletedModules(courseId);
            const index = completed.indexOf(moduleId);
            if (index > -1) {
                completed.splice(index, 1);
                const key = getCompletedModulesKey(courseId);
                localStorage.setItem(key, JSON.stringify(completed));
                console.log(`❌ Module unmarked: ${moduleId}`);
                // Refresh profile to update percentages
                location.reload();
            }
        }

        /**
         * Check if a module is completed
         */
        function isModuleCompleted(courseId, moduleId) {
            return getCompletedModules(courseId).includes(moduleId);
        }

        /**
         * Navigate to course viewer and pass full course data
         */
        function navigateToCourseViewer(courseId) {
            console.log('🚀 Navigating to course viewer for:', courseId);
            
            if (window.courseData && window.courseData[courseId]) {
                const courseInfo = window.courseData[courseId];
                console.log('📚 Passing course data:', courseInfo);
                
                // Store the full course object in localStorage for the viewer
                localStorage.setItem('careersync_current_course_id', courseId);
                localStorage.setItem('careersync_current_course_data', JSON.stringify(courseInfo));
                
                // Navigate to course viewer
                window.location.href = `course-viewer.html?courseId=${courseId}`;

                                                </div>
                                            `).join('')}
                                        </div>
                                    </div>

                                ${activities.length > 0 ? `
                                    <div style="margin-bottom: 12px;">
                                        <p style="font-weight: 600; color: #0F172A; margin: 0 0 8px 0; font-size: 13px; text-transform: uppercase; letter-spacing: 0.5px;">🎯 Activities (${activities.length})</p>
                                        <div style="background: #F8FAFC; padding: 12px; border-radius: 8px;">
                                            ${activities.map((activity, actIdx) => `
                                                <div style="padding: 8px 0; border-bottom: ${actIdx < activities.length - 1 ? '1px solid #E2E8F0' : 'none'}; font-size: 13px; color: #475569;">
                                                    ${typeof activity === 'object' ? `

                                                        ${activity.description ? `<div style="color: #94A3B8; margin-top: 4px;">${activity.description}</div>` : ''}

                                                    ` : `

                                                    `}
                                                </div>
                                            `).join('')}
                                        </div>
                                    </div>
                                ` : ''}
                                
                                ${readingMaterials.length > 0 ? `
                                    <div style="margin-bottom: 12px;">
                                        <p style="font-weight: 600; color: #0F172A; margin: 0 0 8px 0; font-size: 13px; text-transform: uppercase; letter-spacing: 0.5px;">📖 Reading Materials (${readingMaterials.length})</p>
                                        <div style="background: #F8FAFC; padding: 12px; border-radius: 8px;">
                                            ${readingMaterials.map((material, matIdx) => `
                                                <div style="padding: 8px 0; border-bottom: ${matIdx < readingMaterials.length - 1 ? '1px solid #E2E8F0' : 'none'}; font-size: 13px;">
                                                    ${material.url ? `

                                                            ${material.title || 'Reading Material'}
                                                        </a>
                                                    ` : `
                                                        <strong style="color: #0F172A;">${material.title || 'Reading Material'}</strong>

                                ${youtubeLinks.length > 0 ? `

                                    </div>

                                ${project ? `

                                        <p style="font-weight: 600; color: #0F172A; margin: 0 0 8px 0; font-size: 13px; text-transform: uppercase; letter-spacing: 0.5px;">🚀 Project</p>
                                        <div style="background: #F8FAFC; padding: 12px; border-radius: 8px; border-left: 3px solid #F59E0B;">
                                            <strong style="color: #0F172A;">${project.title || project.name || 'Project'}</strong>
                                            ${project.description ? `<div style="color: #475569; margin-top: 6px; font-size: 13px;">${project.description}</div>` : ''}
                                        </div>
                                    </div>
                                ` : ''}
                                
                                ${assessment ? `
                                    <div style="margin-bottom: 0;">

                                        <div style="background: #F8FAFC; padding: 12px; border-radius: 8px; border-left: 3px solid #10B981;">
                                            <strong style="color: #0F172A;">${assessment.title || assessment.name || 'Assessment'}</strong>
                                            ${assessment.description ? `<div style="color: #475569; margin-top: 6px; font-size: 13px;">${assessment.description}</div>` : ''}

            console.log('📋 Modal HTML content length:', listElement.innerHTML.length);
            console.log('🎨 Setting modal display to flex');
            
            // Make absolutely sure the modal is visible
            modal.style.display = 'flex';
            modal.style.visibility = 'visible';
            modal.style.opacity = '1';
            modal.classList.remove('hidden');
            
            // Force reflow to ensure rendering
            modal.offsetHeight;
            
            console.log('✅ Modal should now be visible!');
            console.log('Modal element:', modal);
            console.log('Modal display style:', window.getComputedStyle(modal).display);
            console.log('Modal visibility:', window.getComputedStyle(modal).visibility);

        /**
         * Handle module checkbox change
         */
        function handleModuleCheckbox(checkbox, courseId, moduleId) {
            if (checkbox.checked) {
                markModuleCompleted(courseId, moduleId);
            } else {
                unmarkModuleCompleted(courseId, moduleId);
            }
        }

        /**
         * Close modules modal
         */
        function closeModulesModal() {
            const modal = document.getElementById('modules-modal');
            modal.style.display = 'none';
        }

        /**
         * Test modal display
         */
        function testModalDisplay() {
            console.log('🧪 Testing modal display...');
            const modal = document.getElementById('modules-modal');
            console.log('Modal element:', modal);
            console.log('Current display:', modal.style.display);
            modal.style.display = 'flex';
            console.log('Display changed to:', modal.style.display);
            console.log('Computed display:', window.getComputedStyle(modal).display);
        }

        /**
         * Close modal when clicking outside
         */
        document.addEventListener('click', function(event) {
            const modal = document.getElementById('modules-modal');
            if (event.target === modal) {
                closeModulesModal();
            }
        });

        async function loadProfile() {
            try {
                console.log('📋 Loading profile from live API...');
                const loadingEl = document.getElementById('loading');
                const profileContent = document.getElementById('profile-content');
                
                if (loadingEl) loadingEl.style.display = 'flex';
                if (profileContent) profileContent.style.display = 'none';
                
                const token = localStorage.getItem('careersync_token');
                const backendUrl = window.getModuleUrls().backend;
                const headers = { 'Content-Type': 'application/json' };
                if (token) headers.Authorization = `Bearer ${token}`;

                // Fetch user profile from backend
                const userResponse = await fetch(backendUrl + '/api/auth/me', {
                    credentials: 'include',
                    headers: headers
                });

                if (!userResponse.ok) {
                    throw new Error(`Failed to fetch user: ${userResponse.status}`);
                }

                const userData = await userResponse.json();
                const user = userData.user || userData;
                console.log('✅ User data:', user);

                // Fetch all user data in parallel
                const userId = user._id || user.id;
                const email = user.email;

                const [coursesResp, roadmapsResp, evalsResp] = await Promise.all([
                    fetch(backendUrl + `/api/courses/user/${userId}`, { 
                        credentials: 'include',
                        headers: headers
                    }),
                    fetch(backendUrl + `/api/roadmaps/user/${userId}`, { 
                        credentials: 'include',
                        headers: headers
                    }),
                    fetch(backendUrl + `/api/evaluations/user/${userId}`, { 
                        credentials: 'include',
                        headers: headers
                    })
                ]);

                const courses = coursesResp.ok ? await coursesResp.json() : [];
                const roadmaps = roadmapsResp.ok ? await roadmapsResp.json() : [];
                const evaluations = evalsResp.ok ? await evalsResp.json() : [];

                console.log('✅ All profile data loaded from API');
                
                displayProfile(user, courses, roadmaps, evaluations);
                
                if (loadingEl) loadingEl.style.display = 'none';
                if (profileContent) profileContent.style.display = 'block';
                
            } catch (error) {
                console.error('❌ Error loading profile:', error);
                const loadingEl = document.getElementById('loading');
                const profileContent = document.getElementById('profile-content');
                if (loadingEl) loadingEl.style.display = 'none';
                if (profileContent) profileContent.style.display = 'block';
            }
        }

        function displayProfile(user, courses, roadmaps, evaluations) {
            console.log('📱 Displaying profile with live API data');
            const initials = (user.name || user.full_name || user.email || 'U').charAt(0).toUpperCase();
            
            // Update user info
            if (document.getElementById('profile-avatar-large')) {
                document.getElementById('profile-avatar-large').textContent = initials;
            }
            if (document.getElementById('profile-full-name')) {
                document.getElementById('profile-full-name').textContent = user.name || user.full_name || 'User';
            }
            if (document.getElementById('profile-full-email')) {
                document.getElementById('profile-full-email').textContent = user.email || 'user@careersync.com';
            }
            
            // Ensure arrays
            const courseArray = Array.isArray(courses) ? courses : (courses.courses || courses.data || []);
            const roadmapArray = Array.isArray(roadmaps) ? roadmaps : (roadmaps.roadmaps || roadmaps.data || []);
            const evalArray = Array.isArray(evaluations) ? evaluations : (evaluations.evaluations || evaluations.data || []);
            
            // Update stats
            if (document.getElementById('stat-courses')) {
                document.getElementById('stat-courses').textContent = courseArray.length;
            }
            if (document.getElementById('stat-roadmaps')) {
                document.getElementById('stat-roadmaps').textContent = roadmapArray.length;
            }
            if (document.getElementById('stat-evaluations')) {
                document.getElementById('stat-evaluations').textContent = evalArray.length;
            }
            
            // Display courses
            const courseContainer = document.getElementById('courses-container');
            if (courseContainer) {
                if (courseArray && courseArray.length > 0) {
                    courseContainer.innerHTML = courseArray.map(course => `
                        <div class="item-card">
                            <div class="item-header">
                                <div>
                                    <p class="item-title">${course.title || 'Course'}</p>
                                </div>
                            </div>
                            <div class="progress-container">
                                <div class="progress-bar">
                                    <div class="progress-fill" style="width: ${course.progress || 0}%"></div>
                                </div>
                            </div>
                        </div>
                    `).join('');
                } else {
                    courseContainer.innerHTML = '<div class="empty-state"><div class="empty-icon">📚</div><div class="empty-text">No courses yet</div></div>';
                }
            }
            
            // Display roadmaps
            const roadmapContainer = document.getElementById('roadmaps-container');
            if (roadmapContainer) {
                if (roadmapArray && roadmapArray.length > 0) {
                    roadmapContainer.innerHTML = roadmapArray.map(roadmap => `
                        <div class="item-card">
                            <div class="item-header">
                                <div>
                                    <p class="item-title">${roadmap.title || 'Roadmap'}</p>
                                </div>
                            </div>
                            <div class="progress-container">
                                <div class="progress-bar">
                                    <div class="progress-fill" style="width: ${roadmap.progress || 0}%"></div>
                                </div>
                            </div>
                        </div>
                    `).join('');
                } else {
                    roadmapContainer.innerHTML = '<div class="empty-state"><div class="empty-icon">🗺️</div><div class="empty-text">No roadmaps yet</div></div>';
                }
            }
            
            // Display evaluations
            const evalContainer = document.getElementById('evaluations-container');
            if (evalContainer) {
                if (evalArray && evalArray.length > 0) {
                    evalContainer.innerHTML = evalArray.map(eval => `
                        <div class="item-card">
                            <div class="item-header">
                                <div>
                                    <p class="item-title">${eval.title || eval.skillName || 'Evaluation'}</p>
                                </div>
                            </div>
                            <div class="progress-container">
                                <div class="progress-bar">
                                    <div class="progress-fill" style="width: ${eval.score || 0}%"></div>
                                </div>
                            </div>
                        </div>
                    `).join('');
                } else {
                    evalContainer.innerHTML = '<div class="empty-state"><div class="empty-icon">✅</div><div class="empty-text">No evaluations yet</div></div>';
                }
            }
            
            console.log('✅ Profile display complete');
        }

        // Refresh profile when page becomes visible (returns from course-viewer)
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') {
                console.log('📱 Page returned to focus, refreshing profile...');
                loadProfile();
            }
        });

        // Also refresh when navigating back to the page
        window.addEventListener('pageshow', (event) => {
            // Fires when navigating back via browser back button
            if (event.persisted) {
                console.log('📱 Page loaded from cache, refreshing profile...');
                loadProfile();
            }
        });

        // Refresh when window gains focus
        window.addEventListener('focus', () => {
            console.log('📱 Window focused, refreshing profile...');
            loadProfile();
        });

        // Logout handler
        window.addEventListener('DOMContentLoaded', () => {
            const logoutBtn = document.getElementById('logout-btn');
            if (logoutBtn) {
                logoutBtn.addEventListener('click', () => {
                    localStorage.removeItem('careersync_user');
                    localStorage.removeItem('careersync_token');
                    window.location.href = window.getModuleUrls().landing + '/auth.html';
                });
            }
            loadProfile();
        });
    </script>
    
    <!-- Footer will be injected automatically by footer-component.js -->
</body>
