<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CareerOS | My Profile</title>
    <link rel="icon" type="image/svg+xml"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%234F46E5'/%3E%3Ccircle cx='16' cy='16' r='6' fill='white'/%3E%3C/svg%3E">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --brand-primary: #4F46E5;
            --brand-secondary: #7C3AED;
            --text-primary: #0F172A;
            --text-secondary: #475569;
            --text-tertiary: #94A3B8;
            --bg-light: #FFFFFF;
            --border-light: #E2E8F0;
            --header-height: 72px;
            --container-max: 1200px;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #F8FAFC 0%, #F1F5F9 100%);
            color: var(--text-primary);
            min-height: 100vh;
        }

        .careeros-header {
            position: sticky;
            top: 0;
            z-index: 100;
            height: var(--header-height);
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(226, 232, 240, 0.8);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .careeros-header-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            max-width: var(--container-max);
            margin: 0 auto;
            padding: 0 24px;
            height: 100%;
        }

        .careeros-brand {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: var(--text-primary);
            font-size: 1.125rem;
            font-weight: 700;
        }

        .careeros-brand-icon {
            width: 28px;
            height: 28px;
            border-radius: 6px;
            background: linear-gradient(135deg, var(--brand-primary) 0%, var(--brand-secondary) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 700;
            font-size: 0.75rem;
        }

        .careeros-nav-links {
            display: flex;
            gap: 32px;
            flex: 1;
            justify-content: center;
        }

        .careeros-nav-link {
            color: var(--text-secondary);
            font-weight: 500;
            text-decoration: none;
            padding: 8px 0;
            transition: color 0.2s;
        }

        .careeros-nav-link:hover {
            color: var(--brand-primary);
        }

        .careeros-nav-auth {
            display: flex;
            gap: 16px;
            align-items: center;
        }

        .careeros-btn {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.875rem;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s;
        }

        .careeros-btn-secondary {
            background: rgba(79, 70, 229, 0.1);
            color: var(--brand-primary);
        }

        .careeros-btn-secondary:hover {
            background: rgba(79, 70, 229, 0.2);
        }

        .container {
            max-width: var(--container-max);
            margin: 0 auto;
            padding: 0 24px;
        }

        .profile-container {
            padding: 40px 0;
        }

        .profile-header {
            display: grid;
            grid-template-columns: 1fr 2fr 1fr;
            gap: 32px;
            margin-bottom: 40px;
            background: white;
            padding: 32px;
            border-radius: 16px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        .profile-avatar-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .profile-avatar-large {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--brand-primary) 0%, var(--brand-secondary) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 48px;
            font-weight: 700;
            margin-bottom: 16px;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
        }

        .profile-name {
            font-size: 28px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 8px;
        }

        .profile-email {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 16px;
        }

        .profile-bio {
            font-size: 14px;
            color: var(--text-secondary);
            max-width: 300px;
            line-height: 1.5;
        }

        .profile-info {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .profile-info-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 16px 0;
            border-bottom: 1px solid var(--border-light);
        }

        .profile-info-item:last-child {
            border-bottom: none;
        }

        .info-icon {
            font-size: 20px;
        }

        .info-text {
            flex: 1;
        }

        .info-label {
            font-size: 12px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .info-value {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .profile-stats {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
        }

        .stat-card {
            padding: 16px;
            background: linear-gradient(135deg, rgba(79, 70, 229, 0.05) 0%, rgba(124, 58, 237, 0.05) 100%);
            border-radius: 12px;
            text-align: center;
            border: 1px solid rgba(79, 70, 229, 0.1);
        }

        .stat-value {
            font-size: 32px;
            font-weight: 700;
            color: var(--brand-primary);
            margin-bottom: 4px;
        }

        .stat-label {
            font-size: 13px;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .content-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 32px;
            margin-bottom: 40px;
        }

        .section {
            background: white;
            border-radius: 16px;
            padding: 28px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        .section-title {
            font-size: 20px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .items-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .item-card {
            padding: 16px;
            background: linear-gradient(135deg, rgba(79, 70, 229, 0.05) 0%, rgba(124, 58, 237, 0.05) 100%);
            border-radius: 12px;
            border-left: 4px solid var(--brand-primary);
            transition: all 0.3s;
            cursor: pointer;
        }

        .item-card:hover {
            background: linear-gradient(135deg, rgba(79, 70, 229, 0.1) 0%, rgba(124, 58, 237, 0.1) 100%);
            transform: translateX(4px);
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.1);
        }

        .item-title {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-primary);
            margin: 0 0 8px 0;
        }

        .item-meta {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
        }

        .meta-tag {
            font-size: 12px;
            color: var(--text-secondary);
            background: rgba(79, 70, 229, 0.1);
            padding: 4px 8px;
            border-radius: 4px;
        }

        .empty-state {
            padding: 40px 20px;
            text-align: center;
            color: var(--text-secondary);
        }

        .empty-icon {
            font-size: 48px;
            margin-bottom: 16px;
        }

        .empty-text {
            font-size: 16px;
            margin-bottom: 16px;
        }

        .action-buttons {
            display: flex;
            gap: 12px;
        }

        .action-btn {
            flex: 1;
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
            display: inline-block;
        }

        .action-btn.primary {
            background: var(--brand-primary);
            color: white;
        }

        .action-btn.primary:hover {
            background: var(--brand-secondary);
        }

        .action-btn.secondary {
            background: var(--border-light);
            color: var(--text-primary);
        }

        .action-btn.secondary:hover {
            background: #cbd5e1;
        }

        @media (max-width: 768px) {
            .profile-header {
                grid-template-columns: 1fr;
                text-align: center;
            }

            .content-grid {
                grid-template-columns: 1fr;
            }

            .careeros-nav-links {
                display: none;
            }
        }

        .loading {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-secondary);
        }
    </style>
    <!-- Shared Header: injected at runtime via shared-auth.js -->
    <script type="module" src="./api-auth.js"></script>
</head>

<body>
    <!-- Shared Header will be injected automatically by /shared-header.js -->

    <!-- Profile Content -->
    <main class="profile-container">
        <div class="container">
            <div id="loading" class="loading">Loading your profile...</div>
            <div id="profile-content" style="display: none;">
                <!-- Profile Header -->
                <div class="profile-header">
                    <div class="profile-avatar-section">
                        <div class="profile-avatar-large" id="profile-avatar-large">U</div>
                        <div class="profile-name" id="profile-full-name">User Name</div>
                        <div class="profile-email" id="profile-full-email">user@email.com</div>
                        <div class="profile-bio" id="profile-full-bio"></div>
                    </div>

                    <div class="profile-info">
                        <div class="profile-info-item">
                            <div class="info-icon">📅</div>
                            <div class="info-text">
                                <div class="info-label">Member Since</div>
                                <div class="info-value" id="profile-joined">Jan 1, 2024</div>
                            </div>
                        </div>
                        <div class="profile-info-item">
                            <div class="info-icon">👤</div>
                            <div class="info-text">
                                <div class="info-label">Role</div>
                                <div class="info-value" id="profile-role">User</div>
                            </div>
                        </div>
                        <div class="profile-info-item">
                            <div class="info-icon">⏱️</div>
                            <div class="info-text">
                                <div class="info-label">Active Days</div>
                                <div class="info-value" id="profile-active-days">0 days</div>
                            </div>
                        </div>
                    </div>

                    <div class="profile-stats">
                        <div class="stat-card">
                            <div class="stat-value" id="stat-courses">0</div>
                            <div class="stat-label">Courses</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-value" id="stat-roadmaps">0</div>
                            <div class="stat-label">Roadmaps</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-value" id="stat-evaluations">0</div>
                            <div class="stat-label">Evaluations</div>
                        </div>
                    </div>
                </div>

                <!-- Content Grid -->
                <div class="content-grid">
                    <!-- Courses -->
                    <div class="section">
                        <div class="section-title">📚 My Courses</div>
                        <div id="courses-container" class="items-list"></div>
                    </div>

                    <!-- Roadmaps -->
                    <div class="section">
                        <div class="section-title">🗺️ My Roadmaps</div>
                        <div id="roadmaps-container" class="items-list"></div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        async function loadProfile() {
            try {
                const user = localStorage.getItem('careeros_user');
                const token = localStorage.getItem('careeros_token');

                if (!user || !token) {
                    window.location.href = 'http://localhost:4173/auth.html';
                    return;
                }

                const userData = JSON.parse(user);
                const userId = userData.id || userData._id;

                // Always display the full cached profile immediately
                displayCachedProfile(userData);

                // Then try to fetch additional data from backend if available
                try {
                    const response = await fetch(`http://localhost:5000/api/profile/${userId}`, {
                        headers: {
                            'Authorization': `Bearer ${token}`
                        }
                    });

                    if (response.ok) {
                        const data = await response.json();
                        if (data.success && data.profile) {
                            // Update with backend data if available
                            displayProfile(data.profile);
                        }
                    }
                } catch (backendError) {
                    console.log('Backend profile not available, using localStorage data:', backendError);
                }
            } catch (error) {
                console.error('Error loading profile:', error);
                document.getElementById('loading').innerHTML = '<p>Error loading profile. Please try again.</p>';
            }
        }

        function displayBasicProfile(userData) {
            const initials = (userData.name || userData.full_name || userData.email || 'U').charAt(0).toUpperCase();
            document.getElementById('profile-avatar-large').textContent = initials;
            document.getElementById('profile-full-name').textContent = userData.name || userData.full_name || 'User';
            document.getElementById('profile-full-email').textContent = userData.email || 'No email';
        }

        function displayCachedProfile(profile) {
            const initials = (profile.name || profile.full_name || profile.username || profile.email || 'U').charAt(0).toUpperCase();
            const displayName = profile.name || profile.full_name || profile.username || profile.email?.split('@')[0] || 'User';

            // Update header info
            document.getElementById('profile-avatar-large').textContent = initials;
            document.getElementById('profile-full-name').textContent = displayName;
            document.getElementById('profile-full-email').textContent = profile.email || 'No email';
            document.getElementById('profile-full-bio').textContent = profile.bio || 'Welcome to CareerOS! Start creating courses, roadmaps, and taking evaluations.';
            
            // Show visit count
            const visitCount = profile.visitCount || localStorage.getItem('careeros_profile_visits') || 0;
            const lastAccessed = profile.lastAccessed ? new Date(profile.lastAccessed).toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' }) : 'Today';
            
            document.getElementById('profile-joined').textContent = profile.created_at ? new Date(profile.created_at).toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' }) : 'Recently';
            document.getElementById('profile-role').textContent = profile.role || 'Learner';
            document.getElementById('profile-active-days').textContent = `${visitCount} visits`;

            // Get enrolled courses from localStorage
            const enrolledCourses = JSON.parse(localStorage.getItem('careeros_enrolled_courses') || '[]');
            const savedRoadmaps = JSON.parse(localStorage.getItem('careeros_saved_roadmaps') || '[]');

            // Update stats
            document.getElementById('stat-courses').textContent = enrolledCourses.length;
            document.getElementById('stat-roadmaps').textContent = savedRoadmaps.length;
            document.getElementById('stat-evaluations').textContent = '0';

            // Display courses
            const coursesContainer = document.getElementById('courses-container');
            if (enrolledCourses.length > 0) {
                coursesContainer.innerHTML = enrolledCourses.map(course => `
                    <div class="item-card" onclick="window.location.href='http://localhost:3002/course-generated/${course.id}'">
                        <p class="item-title">${course.title}</p>
                        <div class="item-meta">
                            <span class="meta-tag">📚 ${course.modules || 0} modules</span>
                            <span class="meta-tag">🕐 Enrolled ${new Date(course.enrolledAt).toLocaleDateString()}</span>
                            <span class="meta-tag">📊 ${course.progress || 0}% complete</span>
                        </div>
                    </div>
                `).join('');
            } else {
                coursesContainer.innerHTML = '<div class="empty-state"><div class="empty-icon">📚</div><div class="empty-text">No courses created yet</div><a href="http://localhost:3002" class="action-btn primary" style="max-width: 200px; margin: 0 auto;">Create Your First Course</a></div>';
            }

            // Display roadmaps
            const roadmapsContainer = document.getElementById('roadmaps-container');
            if (savedRoadmaps.length > 0) {
                roadmapsContainer.innerHTML = savedRoadmaps.map(roadmap => `
                    <div class="item-card" onclick="window.location.href='http://localhost:5173'">
                        <p class="item-title">${roadmap.title}</p>
                        <div class="item-meta">
                            <span class="meta-tag">🗺️ ${roadmap.stages || 0} stages</span>
                            <span class="meta-tag">🕐 Created ${new Date(roadmap.createdAt).toLocaleDateString()}</span>
                        </div>
                    </div>
                `).join('');
            } else {
                roadmapsContainer.innerHTML = '<div class="empty-state"><div class="empty-icon">🗺️</div><div class="empty-text">No roadmaps created yet</div><a href="http://localhost:5173" class="action-btn primary" style="max-width: 200px; margin: 0 auto;">Create Your First Roadmap</a></div>';
            }

            // Show content, hide loading
            document.getElementById('loading').style.display = 'none';
            document.getElementById('profile-content').style.display = 'block';
        }

        function displayProfile(profile) {
            const initials = (profile.name || profile.email).charAt(0).toUpperCase();

            // Update header info
            document.getElementById('profile-avatar-large').textContent = initials;
            document.getElementById('profile-full-name').textContent = profile.name || 'User';
            document.getElementById('profile-full-email').textContent = profile.email;
            document.getElementById('profile-full-bio').textContent = profile.bio || 'No bio yet';
            document.getElementById('profile-joined').textContent = new Date(profile.joinedAt).toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
            document.getElementById('profile-role').textContent = profile.role.charAt(0).toUpperCase() + profile.role.slice(1);
            
            // Include visit count in active days
            const visitCount = localStorage.getItem('careeros_profile_visits') || 0;
            document.getElementById('profile-active-days').textContent = `${profile.stats.activeDays} days | ${visitCount} visits`;

            // Update stats
            document.getElementById('stat-courses').textContent = profile.stats.totalCourses;
            document.getElementById('stat-roadmaps').textContent = profile.stats.totalRoadmaps;
            document.getElementById('stat-evaluations').textContent = profile.stats.totalEvaluations;

            // Display courses
            const coursesContainer = document.getElementById('courses-container');
            if (profile.courses && profile.courses.length > 0) {
                coursesContainer.innerHTML = profile.courses.map(course => `
                    <div class="item-card">
                        <p class="item-title">${course.title}</p>
                        <div class="item-meta">
                            <span class="meta-tag">${course.level}</span>
                            <span class="meta-tag">${course.modulesCount} modules</span>
                            <span class="meta-tag">${course.duration}</span>
                        </div>
                    </div>
                `).join('');
            } else {
                coursesContainer.innerHTML = '<div class="empty-state"><div class="empty-icon">📚</div><div class="empty-text">No courses created yet</div><a href="http://localhost:3002" class="action-btn primary" style="max-width: 200px; margin: 0 auto;">Create Your First Course</a></div>';
            }

            // Display roadmaps
            const roadmapsContainer = document.getElementById('roadmaps-container');
            if (profile.roadmaps && profile.roadmaps.length > 0) {
                roadmapsContainer.innerHTML = profile.roadmaps.map(roadmap => `
                    <div class="item-card">
                        <p class="item-title">${roadmap.title}</p>
                        <div class="item-meta">
                            <span class="meta-tag">${roadmap.targetRole}</span>
                            <span class="meta-tag">${roadmap.progress}% complete</span>
                            <span class="meta-tag">${roadmap.status}</span>
                        </div>
                    </div>
                `).join('');
            } else {
                roadmapsContainer.innerHTML = '<div class="empty-state"><div class="empty-icon">🗺️</div><div class="empty-text">No roadmaps created yet</div><a href="http://localhost:5173" class="action-btn primary" style="max-width: 200px; margin: 0 auto;">Create Your First Roadmap</a></div>';
            }

            // Show content, hide loading
            document.getElementById('loading').style.display = 'none';
            document.getElementById('profile-content').style.display = 'block';
        }

        // Logout handler
        document.getElementById('logout-btn').addEventListener('click', () => {
            localStorage.removeItem('careeros_profile_data');
            localStorage.removeItem('careeros_user');
            localStorage.removeItem('careeros_token');
            localStorage.removeItem('careeros_auth');
            window.location.href = 'http://localhost:4173/auth.html';
        });

        // Load profile on page load
        loadProfile();
    </script>
</body>


</html>
