<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Backend Test</title>
    <style>
        body { font-family: Arial; padding: 20px; background: #f5f5f5; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; }
        h1 { color: #333; }
        .test { margin: 20px 0; padding: 15px; border: 1px solid #ddd; border-radius: 4px; }
        .test.success { background: #d4edda; border-color: #28a745; }
        .test.error { background: #f8d7da; border-color: #dc3545; }
        .test.pending { background: #e7d4f5; border-color: #6f42c1; }
        button { padding: 10px 20px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #0056b3; }
        code { background: #f4f4f4; padding: 2px 6px; border-radius: 3px; }
        pre { background: #f4f4f4; padding: 10px; border-radius: 4px; overflow-x: auto; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔧 Backend Connectivity Test</h1>
        <p>Click the button below to test if the backend is responding</p>
        <button onclick="runTests()">Run Connectivity Tests</button>
        
        <div id="results"></div>
    </div>

    <script>
        const API_BASE = 'http://localhost:5000/api';
        
        async function runTests() {
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = '<div class="test pending"><h3>Running tests...</h3></div>';
            
            let html = '';
            
            // Test 1: Backend Health
            html += '<div class="test pending"><h3>Test 1: Backend Health Check</h3><p>Checking if backend is running...</p></div>';
            resultsDiv.innerHTML = html;
            
            try {
                const resp = await fetch(`${API_BASE}/health`);
                const data = await resp.json();
                
                if (resp.ok) {
                    html = html.replace('pending', 'success');
                    html += `<p>Status: <code>${data.status}</code></p>`;
                    html += `<p>Message: ${data.message}</p>`;
                } else {
                    html = html.replace('pending', 'error');
                    html += `<p>Status Code: ${resp.status}</p>`;
                }
            } catch (error) {
                html = html.replace('pending', 'error');
                html += `<p>Error: ${error.message}</p>`;
                html += `<p><strong>This means the backend is NOT running!</strong></p>`;
                html += `<p>Solution: Run <code>npm start</code> in <code>backend/main-app/backend</code> folder</p>`;
                resultsDiv.innerHTML = html;
                return;
            }
            
            resultsDiv.innerHTML = html;
            
            // Test 2: Login Request
            html += '<div class="test pending"><h3>Test 2: Login Request</h3><p>Testing login endpoint...</p></div>';
            resultsDiv.innerHTML = html;
            
            try {
                const resp = await fetch(`${API_BASE}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({ 
                        email: 'test@skillroute.ai',
                        password: 'Test@1234'
                    })
                });
                
                const data = await resp.json();
                
                if (resp.ok) {
                    html = html.replace(/pending<\/div>$/, 'success</div>');
                    html += `<p>User: <code>${data.user.email}</code></p>`;
                    html += `<p>Name: ${data.user.name}</p>`;
                } else {
                    html = html.replace(/pending<\/div>$/, 'error</div>');
                    html += `<p>Error: ${data.error}</p>`;
                    html += `<p>Status Code: ${resp.status}</p>`;
                }
            } catch (error) {
                html = html.replace(/pending<\/div>$/, 'error</div>');
                html += `<p>Network Error: ${error.message}</p>`;
                html += `<p><strong>Possible causes:</strong></p>`;
                html += `<ul>`;
                html += `<li>Backend is not running</li>`;
                html += `<li>CORS is not configured correctly</li>`;
                html += `<li>Port 5000 is blocked by firewall</li>`;
                html += `</ul>`;
            }
            
            resultsDiv.innerHTML = html;
            
            // Test 3: Cookie Status
            html += '<div class="test"><h3>Test 3: Cookie Status</h3>';
            html += `<p>Current cookies: <code>${document.cookie || '(no cookies)'}</code></p>`;
            if (document.cookie.includes('careeros_token')) {
                html = html.replace('<div class="test">', '<div class="test success">');
                html += '<p>✅ Auth cookie is set!</p>';
            } else {
                html = html.replace('<div class="test">', '<div class="test error">');
                html += '<p>❌ No auth cookie found</p>';
            }
            html += '</div>';
            
            resultsDiv.innerHTML = html;
        }
    </script>
</body>
</html>
