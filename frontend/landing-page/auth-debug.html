<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auth Debug - Career Sync</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            padding: 40px;
            background: #f8f9fa;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        h1 { color: #4F46E5; margin-bottom: 20px; }
        h2 { color: #333; margin: 30px 0 15px; font-size: 18px; }
        .status { padding: 15px; border-radius: 8px; margin-bottom: 20px; }
        .status.success { background: #D1FAE5; color: #065F46; }
        .status.error { background: #FEE2E2; color: #991B1B; }
        .data-block {
            background: #F1F5F9;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-family: monospace;
            font-size: 13px;
            white-space: pre-wrap;
            word-break: break-all;
        }
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            margin-right: 10px;
            margin-bottom: 10px;
        }
        .btn-primary { background: #4F46E5; color: white; }
        .btn-secondary { background: #E2E8F0; color: #333; }
        .btn-danger { background: #EF4444; color: white; }
        .actions { margin-top: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 Authentication Debug Tool</h1>
        
        <div id="auth-status"></div>
        
        <h2>📊 LocalStorage Data</h2>
        <div id="localstorage-data"></div>
        
        <h2>🍪 Cookies</h2>
        <div id="cookie-data" class="data-block"></div>
        
        <h2>👤 User Data (Parsed)</h2>
        <div id="user-data"></div>
        
        <div class="actions">
            <button class="btn btn-primary" onclick="window.location.href='profile.html'">Go to Profile</button>
            <button class="btn btn-secondary" onclick="window.location.href='auth.html'">Go to Login</button>
            <button class="btn btn-secondary" onclick="location.reload()">Refresh</button>
            <button class="btn btn-danger" onclick="clearAuth()">Clear Auth Data</button>
        </div>
    </div>

    <script>
        function displayAuthStatus() {
            const user = localStorage.getItem('careeros_user');
            const token = localStorage.getItem('careeros_token');
            const statusDiv = document.getElementById('auth-status');
            
            if (user && token) {
                statusDiv.className = 'status success';
                statusDiv.innerHTML = '✅ <strong>Authenticated:</strong> User and token found in localStorage';
            } else if (user || token) {
                statusDiv.className = 'status error';
                statusDiv.innerHTML = '⚠️ <strong>Partial Auth:</strong> Missing ' + (!user ? 'user' : 'token');
            } else {
                statusDiv.className = 'status error';
                statusDiv.innerHTML = '❌ <strong>Not Authenticated:</strong> No user or token found';
            }
        }

        function displayLocalStorageData() {
            const container = document.getElementById('localstorage-data');
            const keys = Object.keys(localStorage);
            
            if (keys.length === 0) {
                container.innerHTML = '<div class="data-block">No data in localStorage</div>';
                return;
            }
            
            let html = '';
            keys.forEach(key => {
                const value = localStorage.getItem(key);
                const displayValue = value.length > 200 ? value.substring(0, 200) + '...' : value;
                html += `
                    <div class="data-block">
                        <strong>${key}:</strong><br>
                        ${displayValue}
                    </div>
                `;
            });
            
            container.innerHTML = html;
        }

        function displayCookies() {
            const cookieDiv = document.getElementById('cookie-data');
            const cookies = document.cookie;
            
            if (!cookies) {
                cookieDiv.textContent = 'No cookies found';
            } else {
                cookieDiv.textContent = cookies;
            }
        }

        function displayUserData() {
            const container = document.getElementById('user-data');
            const user = localStorage.getItem('careeros_user');
            
            if (!user) {
                container.innerHTML = '<div class="data-block">No user data found</div>';
                return;
            }
            
            try {
                const userData = JSON.parse(user);
                container.innerHTML = '<div class="data-block">' + JSON.stringify(userData, null, 2) + '</div>';
            } catch (e) {
                container.innerHTML = '<div class="data-block" style="color: red;">Error parsing user data: ' + e.message + '</div>';
            }
        }

        function clearAuth() {
            if (confirm('Are you sure you want to clear all authentication data?')) {
                localStorage.removeItem('careeros_user');
                localStorage.removeItem('careeros_token');
                localStorage.removeItem('careeros_auth');
                localStorage.removeItem('user');
                localStorage.removeItem('token');
                alert('Authentication data cleared!');
                location.reload();
            }
        }

        // Initialize
        displayAuthStatus();
        displayLocalStorageData();
        displayCookies();
        displayUserData();

        // Auto-refresh every 3 seconds
        setInterval(() => {
            displayAuthStatus();
            displayLocalStorageData();
        }, 3000);
    </script>
</body>
</html>
